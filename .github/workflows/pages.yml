name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'assets/cyrsassistant-logo-turquoise.png'
      - 'assets/screenshots/**'
      - 'cydoc.config.json'
      - 'package*.json'
      - 'vendor/cydoc/**'
      - 'tools/*help*'
      - 'tools/*pages*'
      - 'tools/cydoc.lock.json'
      - 'tools/docs_reader.mjs'
      - 'tests/manual_browser_smoke.mjs'
      - 'README*.md'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'assets/**'
      - 'cydoc.config.json'
      - 'package*.json'
      - 'vendor/cydoc/**'
      - 'tools/**'
      - 'tests/manual_browser_smoke.mjs'
      - 'README*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned documentation dependencies
        run: npm ci --omit=peer
      - name: Generate and check the complete CyDoc export
        run: npm run docs:pages
      - name: Exercise the reader offline and under a project URL
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node tests/manual_browser_smoke.mjs build/pages-project/site
          node tests/manual_browser_smoke.mjs build/pages-project/site --http
      - name: Check repository history and the published artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts="--all"
          "$RUNNER_TEMP/gitleaks" dir build/pages-project/site --redact --no-banner
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload only the complete documentation export
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages-project/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
